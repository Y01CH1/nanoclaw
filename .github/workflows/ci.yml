name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Codex Migration Gates
        run: npm run test:codex-migration-gates

      - name: Docker Smoke Gate
        run: npm run test:docker-smoke
